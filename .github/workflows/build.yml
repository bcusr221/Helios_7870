name: Build-Helios-7870
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev xz-utils wget curl python2 gcc-aarch64-linux-gnu
      - name: Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make helios_defconfig
          make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: Helios-Kernel
          path: arch/arm64/boot/Image.gz-dtb
